# Render Blueprint – SEO Agent (dashboard + API in one Node web service, Render Postgres).
# New → Blueprint → Aavoraa/SEO-Agent. Secrets are generated by Render; nothing secret is committed.
# Free plan: the service sleeps after 15 min idle (first request then takes ~1 min) and scheduled
# n8n jobs cannot wake it reliably – switch `plan` to starter for real use.
services:
  - type: web
    name: seo-agent
    runtime: node
    plan: free
    region: singapore
    branch: main
    buildCommand: npm ci --include=dev && npm run build
    # Runs database migrations, then the API (which also serves the built dashboard).
    startCommand: npm start
    healthCheckPath: /ready
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: seo-agent-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: APP_ENCRYPTION_KEY
        generateValue: true
      - key: SERVICE_API_KEY
        generateValue: true
      - key: SEO_SITE_URL
        value: https://www.phoenixxit.com/
      - key: AI_PROVIDER
        value: none # set to claude/openai and add ANTHROPIC_API_KEY / OPENAI_API_KEY in the dashboard
      - key: WEBSITE_ADAPTER
        value: manual
      - key: EXPORT_DIR
        value: /tmp/exports
      - key: LOG_LEVEL
        value: info

databases:
  - name: seo-agent-db
    plan: free
    region: singapore
    databaseName: phoenixx_seo
    user: seo

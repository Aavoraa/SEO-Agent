# Phoenixx SEO Agent – full stack
#   cp .env.example .env   (fill in secrets)
#   docker compose up -d --build
#   docker compose --profile setup run --rm n8n-import     # one-time: import n8n workflows
#
# Dashboard: http://localhost:8080   API: http://localhost:4000   n8n: http://localhost:5678

x-n8n-env: &n8n-env
  DB_TYPE: postgresdb
  DB_POSTGRESDB_HOST: postgres
  DB_POSTGRESDB_PORT: 5432
  DB_POSTGRESDB_DATABASE: n8n
  DB_POSTGRESDB_USER: ${POSTGRES_USER:-seo}
  DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
  N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?set N8N_ENCRYPTION_KEY in .env}
  N8N_HOST: ${N8N_HOST:-localhost}
  N8N_PORT: ${N8N_PORT:-5678}
  N8N_PROTOCOL: ${N8N_PROTOCOL:-http}
  WEBHOOK_URL: ${N8N_WEBHOOK_URL:-http://localhost:5678/}
  GENERIC_TIMEZONE: Asia/Kolkata
  TZ: Asia/Kolkata
  # Workflows read SEO_API_URL / SEO_API_KEY / SEO_PROJECT_ID via $env.
  N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
  # Code nodes verify the HMAC signature of SEO Agent events (workflow 12).
  NODE_FUNCTION_ALLOW_BUILTIN: crypto
  N8N_EVENTS_SECRET: ${N8N_EVENTS_SECRET:-}
  N8N_RUNNERS_ENABLED: "true"
  N8N_DIAGNOSTICS_ENABLED: "false"
  EXECUTIONS_DATA_PRUNE: "true"
  EXECUTIONS_DATA_MAX_AGE: "720"
  SEO_API_URL: http://api:4000
  SEO_API_KEY: ${SEO_API_KEY:-}
  SEO_PROJECT_ID: ${SEO_PROJECT_ID:-}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-seo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-phoenixx_seo}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-seo} -d ${POSTGRES_DB:-phoenixx_seo}"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build: { context: ., dockerfile: docker/api.Dockerfile }
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-seo}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-phoenixx_seo}
      API_PORT: 4000
      API_HOST: 0.0.0.0
      DEMO_DATABASE_URL: pglite:///app/.data/demo-db
    depends_on:
      postgres: { condition: service_healthy }
    ports:
      - "4000:4000"
    volumes:
      - exports:/app/exports
      - demo:/app/.data
      # Optional: mount a clone of the website repository for WEBSITE_ADAPTER=git
      # - ../phoenixxit-website:/website
      # Optional: Google service-account key (set GOOGLE_SERVICE_ACCOUNT_KEY_FILE=/secrets/google-sa.json)
      # - ./secrets/google-sa.json:/secrets/google-sa.json:ro

  dashboard:
    build: { context: ., dockerfile: docker/dashboard.Dockerfile }
    restart: unless-stopped
    depends_on: [api]
    ports:
      - "8080:80"

  n8n:
    image: ${N8N_IMAGE:-n8nio/n8n:latest}
    restart: unless-stopped
    environment: *n8n-env
    depends_on:
      postgres: { condition: service_healthy }
      api: { condition: service_started }
    ports:
      - "5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n

  # One-shot: imports/updates the workflows from ./n8n/workflows (run with --profile setup).
  n8n-import:
    image: ${N8N_IMAGE:-n8nio/n8n:latest}
    profiles: ["setup"]
    environment: *n8n-env
    depends_on:
      postgres: { condition: service_healthy }
    entrypoint: ["n8n", "import:workflow", "--separate", "--input=/workflows"]
    volumes:
      - ./n8n/workflows:/workflows:ro
      - n8n_data:/home/node/.n8n

volumes:
  pgdata:
  n8n_data:
  exports:
  demo:
